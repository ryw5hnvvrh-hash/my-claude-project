# video_editor 폴더를 Hugging Face Space(무료 클라우드 서버)로 올린다.
# 필요한 설정 (GitHub 저장소 → Settings → Secrets and variables → Actions):
#   Secrets   HF_TOKEN  : Hugging Face 'Write' 권한 토큰
#   Variables HF_SPACE  : 사용자이름/스페이스이름 (예: thingthathit/autoedit)
name: Deploy video editor to Hugging Face

on:
  push:
    branches: [master, claude/auto-video-editor]
    paths: ["video_editor/**", ".github/workflows/deploy-hf-space.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN 또는 HF_SPACE가 설정되지 않아 배포를 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Space folder
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir space
          cp -r video_editor/autoedit video_editor/sfx video_editor/app.py video_editor/web.py \
                video_editor/requirements.txt video_editor/packages.txt space/
          cat > space/README.md <<'MD'
          ---
          title: THING THAT HIT 자동 편집기
          emoji: 🎬
          colorFrom: pink
          colorTo: red
          sdk: gradio
          sdk_version: 6.29.0
          python_version: "3.11"
          app_file: app.py
          pinned: false
          ---
          영상을 올리면 무음·버벅임 컷, 자막, 소리 보정, 효과음을 넣은 완성 영상을 만들어 줍니다.
          MD
          sed -i 's/^          //' space/README.md

      - name: Push to Hugging Face
        if: steps.check.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy from ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
